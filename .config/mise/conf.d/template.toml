[tasks.bench]
description = "Run benchmarks"
run = "go test -bench=. -benchmem -run=^$ ./..."

[tasks.build]
description = "Build binary"
run = "go build -v -o gh-star-search ./cmd/gh-star-search"

[tasks.ci]
description = "Run all checks (used in GitHub Actions)"
run = [
  "go test -v -coverprofile=coverage.out ./...",
  "go build -v -o gh-star-search ./cmd/gh-star-search",
]

[tasks."verify-released"]
description = "Build and test ignoring any go.work, the way CI sees the module"
# A go.work makes a sibling checkout win over the version go.mod pins, so local
# green says nothing about whether the released dependency actually works. CI has
# no workspace, so this is the only local check that matches it.
env = { GOWORK = "off" }
run = ["go build ./...", "go test ./..."]

[tasks.clean]
description = "Clean build artifacts"
run = "rm -f coverage.out"

[tasks.demo]
description = "Generate VHS demo recordings"
run = 'find . -name "*.tape" -not -path "./.git/*" -exec vhs {} \;'
depends = ["build"]

[tasks.dev]
description = "Run from source (always reflects current code, no stale build)"
run = "go run ./cmd/gh-star-search"
raw_args = true

[tasks.format]
description = "Format code with golangci-lint and golines"
run = ["golangci-lint run --fix ./...", "golines -w -m 120 ."]

[tasks.hooks]
description = "Run git hooks"
run = "hk fix --quiet"

[tasks.lint]
description = "Run linter"
raw_args = true
run = "golangci-lint run ./..."

[tasks.test]
description = "Run tests with coverage"
raw_args = true
run = "go test -coverprofile=coverage.out ./..."

[tasks."test:coverage-min"]
description = "Verify minimum coverage threshold (70%)"
run = '''
go test -coverprofile=coverage.out -coverpkg=./... ./...
coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
echo "Current coverage: ${coverage}%"
if (( $(awk "BEGIN {print ($coverage < 70)}") )); then
    echo "Coverage ${coverage}% is below 70% minimum threshold"
    exit 1
fi
'''

[tasks."test:view-coverage"]
description = "View coverage report in browser"
run = "go tool cover -html=coverage.out"

# Every literal here is listed in .doneram.pkl and updated by doneram. "latest"
# is deliberately absent: a formatter or linter that resolves differently on a
# laptop than on a runner fails only in CI, which is the worst place to find out.
[tools]
actionlint = "1.7.12"
go = "1.26.6"
"go:github.com/golangci/golines" = "0.15.0"
"golangci-lint" = "2.13.2"
hk = "1.56.1"
jq = "1.8.2"
ls-lint = "2.3.1"
"pipx:commitizen" = "4.18.0"
"pipx:yamllint" = "1.38.0"
pkl = "0.32.1"
shellcheck = "0.11.0"
tombi = "1.5.0"
typos = "1.50.0"
