# Please see the documentation for all configuration options:
#   https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot

# See Dependabot logs in: https://github.com/<owner>/<repo>/network/updates (under "Insights" tab)
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Untagged submodules: Dependabot resolves these to github.com/charmbracelet/x@v0.1.0,
    # which lacks the package, and errors the run. Drop each once it ships its own tag.
    ignore:
      - dependency-name: "github.com/charmbracelet/x/exp/golden"
      - dependency-name: "github.com/charmbracelet/x/vt"
    groups:
      go-dependencies:
        update-types:
          - "major"
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        update-types:
          - "major"
          - "minor"
          - "patch"
