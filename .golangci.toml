# Configuration file for golangci-lint
# For more options, see https://golangci-lint.run/usage/configuration/

version = "2"

[formatters]
enable = ["gci", "gofmt", "gofumpt", "goimports"]

[formatters.settings.gci]
sections = ["standard", "default", "prefix(github.com/KyleKing/gh-star-search)"]

[formatters.settings.gofumpt]
extra-rules = true

[formatters.settings.goimports]
local-prefixes = ["github.com/KyleKing/gh-star-search"]

[linters]
disable = [
  "contextcheck",  # v1.1: requires plumbing context through storage constructors
  "depguard",  # requires allowlist/denylist configuration
  "dupl",  # v1.1: some duplication is acceptable in v1.0
  "err113",  # v1.1: requires sentinel error refactoring across codebase
  "errcheck",  # v1.1: requires systematic unchecked-error cleanup
  "forbidigo",  # requires custom regex configuration
  "gochecknoglobals",  # BubbleTea/lipgloss styles use package-level vars
  "gocognit",  # v1.1: complexity reduction pass
  "gocritic",  # v1.1: style recommendations cleanup
  "gocyclo",  # v1.1: complexity reduction pass
  "godox",  # v1.1: resolve all TODOs
  "goheader",  # copyright headers add noise for personal projects
  "gosec",  # v1.1: security hardening pass
  "govet",  # v1.1: some govet checks conflict with idiomatic patterns
  "ireturn",  # BubbleTea Init/Update methods return interfaces by design
  "lll",  # v1.1: line length cleanup
  "mnd",  # v1.1: magic number cleanup is low priority
  "nestif",  # v1.1: nesting reduction pass
  "nlreturn",  # v1.1: blank line requirements are cosmetic
  "noctx",  # v1.1: http request context propagation
  "paralleltest",  # v1.1: add t.Parallel() across test suite
  "perfsprint",  # v1.1: fmt.Sprintf optimizations are low priority
  "prealloc",  # v1.1: slice preallocation optimization
  "revive",  # v1.1: comprehensive style cleanup
  "tagalign",  # v1.1: struct tag alignment is cosmetic
  "testableexamples",  # examples require live GitHub API access
  "testpackage",  # v1.1: migrate tests to _test packages
  "wrapcheck",  # v1.1: requires wrapping all external errors
  "wsl",  # whitespace linting too nitpicky
]
enable = [
  "asciicheck",
  "bidichk",
  "bodyclose",
  "containedctx",
  "copyloopvar",
  "cyclop",
  "decorder",
  "dogsled",
  "dupword",
  "durationcheck",
  "errchkjson",
  "errname",
  "errorlint",
  "exhaustive",
  "fatcontext",
  "forcetypeassert",
  "funlen",
  "ginkgolinter",
  "gocheckcompilerdirectives",
  "gochecknoinits",
  "gochecksumtype",
  "goconst",
  "gomoddirectives",
  "goprintffuncname",
  "gosmopolitan",
  "grouper",
  "iface",
  "importas",
  "inamedparam",
  "ineffassign",
  "interfacebloat",
  "intrange",
  "loggercheck",
  "maintidx",
  "makezero",
  "mirror",
  "misspell",
  "musttag",
  "nakedret",
  "nilerr",
  "nilnil",
  "nolintlint",
  "nonamedreturns",
  "nosprintfhostport",
  "predeclared",
  "promlinter",
  "protogetter",
  "reassign",
  "rowserrcheck",
  "sloglint",
  "spancheck",
  "sqlclosecheck",
  "staticcheck",
  "tagliatelle",
  "testifylint",
  "thelper",
  "tparallel",
  "unconvert",
  "unparam",
  "unused",
  "usestdlibvars",
  "usetesting",
  "wastedassign",
  "whitespace",
  "zerologlint",
]

[[linters.exclusions.rules]]
# Table-driven tests grow long cases and repeat literals without adding real complexity.
path = "_test\\.go"
linters = ["cyclop", "goconst"]

[[linters.exclusions.rules]]
path = "_test\\.go"
linters = ["cyclop", "errcheck", "gocritic", "gocognit", "gocyclo", "funlen", "lll", "govet", "gosec", "noctx"]

[[linters.exclusions.rules]]
path = "_test\\.go"
text = "hugeParam"

[[linters.exclusions.rules]]
linters = ["gocritic"]
text = "hugeParam"

[[linters.exclusions.rules]]
linters = ["gocritic"]
text = "paramTypeCombine"

[[linters.exclusions.rules]]
linters = ["gocritic"]
text = "ifElseChain"

[[linters.exclusions.rules]]
linters = ["gocritic"]
text = "rangeValCopy"

[[linters.exclusions.rules]]
linters = ["gocritic"]
text = "octalLiteral"

[[linters.exclusions.rules]]
linters = ["gocritic"]
text = "filepathJoin"

[[linters.exclusions.rules]]
linters = ["gocritic"]
text = "emptyFallthrough"

[[linters.exclusions.rules]]
linters = ["gocritic"]
text = "stringXbytes"

[[linters.exclusions.rules]]
linters = ["godox"]
text = "TODO"

[[linters.exclusions.rules]]
linters = ["revive"]
text = "exported.*should have comment"

[[linters.exclusions.rules]]
linters = ["revive"]
text = "package-comments"

[[linters.exclusions.rules]]
linters = ["revive"]
text = "unused-parameter"

[[linters.exclusions.rules]]
linters = ["revive"]
text = "unused-receiver"

[[linters.exclusions.rules]]
linters = ["gosec"]
text = "G107"

[[linters.exclusions.rules]]
linters = ["gosec"]
text = "G304"

[linters.settings.cyclop]
max-complexity = 35

[linters.settings.dupl]
threshold = 100

[linters.settings.errcheck]
check-type-assertions = false
check-blank = false
exclude-functions = ["fmt.Fprintln", "fmt.Fprintf", "fmt.Printf", "(io.Closer).Close", "os.Remove", "os.RemoveAll"]

[linters.settings.exhaustive]
default-signifies-exhaustive = true

[linters.settings.funlen]
lines = 300
statements = 100
ignore-comments = true

[linters.settings.gocognit]
min-complexity = 30

[linters.settings.goconst]
min-len = 3
min-occurrences = 6

[linters.settings.gocritic]
enabled-tags = [
  "diagnostic",
  "style",
  "performance",
  "experimental",
  "opinionated",
]
disabled-checks = [
  "hugeParam",  # BubbleTea root Models are large by design; value receivers keep Update/View copy semantics
  "unnamedResult",  # contradicts nonamedreturns, which is enabled and wins
  "whyNoLint",
]

[linters.settings.gocyclo]
min-complexity = 15

[linters.settings.godot]
scope = "declarations"
capital = true

[linters.settings.govet]
enable-all = true
disable = ["shadow"]

[linters.settings.ireturn]
# Bubble Tea v2 moved to charm.land; both paths are listed so a project on either
# major version lints clean, because Model.Update returns the tea.Model interface.
allow = [
  "error",
  "empty",
  "stdlib",
  "charm.land/bubbletea/v2.Model",
  "github.com/charmbracelet/bubbletea.Model",
]

[linters.settings.lll]
line-length = 140
tab-width = 4

[linters.settings.misspell]
locale = "US"

[linters.settings.mnd]
ignored-functions = ["make", "strconv.*"]

[linters.settings.nakedret]
max-func-lines = 30

[linters.settings.nestif]
min-complexity = 5

[linters.settings.nlreturn]
block-size = 2

[linters.settings.nolintlint]
allow-unused = false
require-explanation = true
require-specific = true

[linters.settings.revive]
enable-all-rules = false
rules = [
  { name = "atomic" },
  { name = "blank-imports" },
  { name = "bool-literal-in-expr" },
  { name = "call-to-gc" },
  { name = "confusing-naming" },
  { name = "constant-logical-expr" },
  { name = "context-as-argument" },
  { name = "context-keys-type" },
  { name = "defer" },
  { name = "dot-imports" },
  { name = "early-return" },
  { name = "empty-block" },
  { name = "empty-lines" },
  { name = "error-naming" },
  { name = "error-return" },
  { name = "error-strings" },
  { name = "errorf" },
  { name = "exported" },
  { name = "if-return" },
  { name = "import-shadowing" },
  { name = "increment-decrement" },
  { name = "indent-error-flow" },
  { name = "modifies-parameter" },
  { name = "modifies-value-receiver" },
  { name = "package-comments" },
  { name = "range" },
  { name = "range-val-address" },
  { name = "range-val-in-closure" },
  { name = "receiver-naming" },
  { name = "redefines-builtin-id" },
  { name = "string-of-int" },
  { name = "struct-tag" },
  { name = "superfluous-else" },
  { name = "time-equal" },
  { name = "time-naming" },
  { name = "unexported-naming" },
  { name = "unexported-return" },
  { name = "unnecessary-stmt" },
  { name = "unreachable-code" },
  { name = "unused-parameter" },
  { name = "unused-receiver" },
  { name = "use-any" },
  { name = "useless-break" },
  { name = "var-declaration" },
  { name = "var-naming" },
  { name = "waitgroup-by-value" },
]

[linters.settings.staticcheck]
checks = ["all", "-ST1000"]

[linters.settings.tagliatelle]
case.rules.json = "snake"
case.rules.yaml = "kebab"

[linters.settings.testifylint]
enable-all = true

[linters.settings.interfacebloat]
max = 20

[linters.settings.maintidx]
under = 10

[linters.settings.unparam]
check-exported = false

[linters.settings.wrapcheck]
ignore-sigs = [
  ".Errorf(",
  "errors.New(",
  "errors.Unwrap(",
  "errors.Join(",
  ".Wrap(",
  ".Wrapf(",
  ".WithMessage(",
  ".WithMessagef(",
  ".WithStack(",
]

[run]
timeout = "5m"
